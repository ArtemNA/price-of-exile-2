# Builds the Windows installer and the portable exe.
# - Run by hand (Actions → Release → Run workflow): the files are the run's artifacts, nothing is published.
# - Push a tag (git tag v0.1.0 && git push origin v0.1.0): the same files plus checksums and notes
#   (.github/RELEASE_NOTES.md + this tag's CHANGELOG.md section) go to a GitHub release.
# The tag must match "version" in src-tauri/tauri.conf.json.
#
# No self-update yet (PLAN "Пізніше"): no signing key, no latest.json; the installer replaces the old version.

name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check the tag against the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version" }

      - run: npx tauri build

      - name: Installer, portable exe, checksums and release notes
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = $conf.version
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$version" }
          $base = $conf.productName -replace ' ', '.'

          New-Item -ItemType Directory -Force dist-release | Out-Null
          $setup = "${base}_${version}_x64-setup.exe"
          Copy-Item (Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe" | Select-Object -First 1) "dist-release/$setup"
          # Portable: the bare exe, settings and log in the same place as the installed app's.
          $portable = "${base}_${version}_x64-portable.exe"
          Copy-Item src-tauri/target/release/price-of-exile-2.exe "dist-release/$portable"

          function Size($file) {
            [string]::Format([cultureinfo]::InvariantCulture, "{0:0.0} MB", (Get-Item $file).Length / 1MB)
          }
          Push-Location dist-release
          @(
            "$((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower())  $setup",
            "$((Get-FileHash $portable -Algorithm SHA256).Hash.ToLower())  $portable"
          ) | Out-File -Encoding ascii SHA256SUMS.txt
          Pop-Location

          $changes = ""
          if (Test-Path CHANGELOG.md) {
            $m = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## $([regex]::Escape($tag))\s*\r?\n(.*?)(?=^## |\z)")
            if ($m.Success) { $changes = $m.Groups[1].Value.Trim() }
          }
          (Get-Content .github/RELEASE_NOTES.md -Raw).
            Replace("{{TAG}}", $tag).
            Replace("{{SETUP}}", $setup).
            Replace("{{SETUP_SIZE}}", (Size "dist-release/$setup")).
            Replace("{{PORTABLE}}", $portable).
            Replace("{{PORTABLE_SIZE}}", (Size "dist-release/$portable")).
            Replace("{{CHANGES}}", $changes) | Out-File -Encoding utf8 release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: price-of-exile-2-windows
          path: |
            dist-release/*
            release-notes.md

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $product = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).productName
          gh release create $tag (Get-ChildItem dist-release/*).FullName --title "$product $tag" --notes-file release-notes.md
